# User-owned declarative operator policy and advisory role views.
#
# operator_policy is the canonical Auto Team policy. Its entries preserve the exact
# requested raw model identity and effort. Runtime endpoint IDs are a deterministic
# translation of these entries in config/runtime-routing.yaml.
#
# planner/scout/worker/reviewer are compatibility views for the advisory Doctor and
# resolver. Their preferred+fallback order is a lossless projection of operator_policy
# for BOSS/SCOUT/STANDARD_WORKER/VERIFIER respectively. They do not select a different
# runtime policy.
#
# Installed unmanaged at ~/.agents/config/models.yaml and preserved across upgrades/uninstall.
# This file does not probe providers or perform native Host allocation/spawn (HOST_EXTERNAL).

operator_policy:
  BOSS:
    - model: "gpt-5.6-sol"
      effort: "high"
    - model: "nine-router/gcli/grok-4.6-high"
      effort: "high"
    - model: "nine-router/cu/cursor-grok-4.6-high"
      effort: "high"
  SCOUT:
    - model: "nine-router/ag/gemini-3.7-flash-medium"
      effort: "medium"
    - model: "commandcode/qwen3.8-flash"
      effort: "high"
  STANDARD_WORKER:
    - model: "nine-router/ag/gemini-3.7-flash-high"
      effort: "high"
    - model: "gpt-5.6-luna"
      effort: "max"
  DEEP_WORKER:
    - model: "nine-router/gcli/grok-4.6-high"
      effort: "high"
    - model: "nine-router/ag/gemini-3.7-flash-high"
      effort: "high"
    - model: "gpt-5.6-sol"
      effort: "high"
  VERIFIER:
    - model: "gpt-5.6-sol"
      effort: "high"
    - model: "nine-router/gcli/grok-4.6-high"
      effort: "high"
    - model: "nine-router/Opus"
      effort: "high"
    - model: "nine-router/ag/gemini-3.7-flash-high"
      effort: "high"
  PREMIUM_SECOND_OPINION:
    - model: "nine-router/Opus"
      effort: "high"
    - model: "gpt-5.6-terra"
      effort: "high"

planner:
  requires:
    - "decision-plane planning"
    - "structured task decomposition"
  preferred:
    - "gpt-5.6-sol"
    - "nine-router/gcli/grok-4.6-high"
  fallback:
    - "nine-router/cu/cursor-grok-4.6-high"
  capability_hints:
    - "reasoning"
    - "long_context"

scout:
  requires:
    - "read-only inspection"
    - "evidence collection"
  preferred:
    - "nine-router/ag/gemini-3.7-flash-medium"
  fallback:
    - "commandcode/qwen3.8-flash"
  capability_hints:
    - "fast"
    - "analysis"

worker:
  requires:
    - "bounded write ownership"
    - "self-contained task packet"
  preferred:
    - "nine-router/ag/gemini-3.7-flash-high"
  fallback:
    - "gpt-5.6-luna"
  capability_hints:
    - "coding"
    - "reasoning"

reviewer:
  requires:
    - "read-only verification"
    - "independence from implementer"
  preferred:
    - "gpt-5.6-sol"
    - "nine-router/gcli/grok-4.6-high"
    - "nine-router/Opus"
  fallback:
    - "nine-router/ag/gemini-3.7-flash-high"
  capability_hints:
    - "review"
    - "analysis"
