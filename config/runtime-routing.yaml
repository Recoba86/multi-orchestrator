# Declarative runtime routing configuration (Auto Team recovery)
#
# Chains are ordered priority/failover, NOT load-balancing distributions.
# A healthy earlier candidate is always selected, including across parallel instances.

schema_version: 1

concurrency:
  max_active_subagents: 6
  max_parallel_scouts: 2
  max_parallel_standard_workers: 4
  max_parallel_deep_workers: 2

failure_domains:
  gpt_plus:
    - "SOL_HIGH"
    - "PLUS_LUNA"
    - "PLUS_LUNA_XHIGH"
    - "PLUS_TERRA"
  gemini:
    - "GEMINI_FLASH_HIGH"
    - "GEMINI_FLASH_MEDIUM"
  supergrok:
    - "GROK_4_6_HIGH"
    - "GROK_CURSOR_HIGH"
  opus:
    - "OPUS_COMBO"
  cheap:
    - "STEP_3_7_FLASH"
    - "QWEN_3_8_FLASH"
  ox_combo:
    - "OX_ALPHA"

independence_groups:
  sol_family:
    - "SOL_HIGH"
  luna_family:
    - "PLUS_LUNA"
    - "PLUS_LUNA_XHIGH"
    - "OCG_LUNA"
  terra_family:
    - "PLUS_TERRA"
  gemini:
    - "GEMINI_FLASH_HIGH"
    - "GEMINI_FLASH_MEDIUM"
  supergrok:
    - "GROK_4_6_HIGH"
    - "GROK_CURSOR_HIGH"
  opus:
    - "OPUS_COMBO"
  cheap:
    - "STEP_3_7_FLASH"
    - "QWEN_3_8_FLASH"
  ox_combo:
    - "OX_ALPHA"

global_targets:
  gemini: 45.0
  supergrok: 25.0
  gpt_plus: 17.0
  cheap: 7.0
  opus: 6.0

ox_overlay: disabled

endpoint_resolution:
  SOL_HIGH:
    model: "gpt-5.6-sol"
    effort: "high"
    enabled: true
    verified: true
    eligibility: "eligible"
  GROK_4_6_HIGH:
    model: "nine-router/gcli/grok-4.6-high"
    effort: "high"
    enabled: true
    verified: true
    eligibility: "eligible"
  GROK_CURSOR_HIGH:
    model: "nine-router/cu/cursor-grok-4.6-high"
    effort: "high"
    enabled: true
    verified: true
    eligibility: "eligible"
  GEMINI_FLASH_MEDIUM:
    model: "nine-router/ag/gemini-3.7-flash-medium"
    effort: "medium"
    enabled: true
    verified: true
    eligibility: "eligible"
  GEMINI_FLASH_HIGH:
    model: "nine-router/ag/gemini-3.7-flash-high"
    effort: "high"
    enabled: true
    verified: true
    eligibility: "eligible"
  PLUS_LUNA:
    model: "gpt-5.6-luna"
    effort: "max"
    enabled: true
    verified: true
    eligibility: "eligible"
  PLUS_LUNA_XHIGH:
    model: "gpt-5.6-luna"
    effort: "xhigh"
    enabled: true
    verified: false
    eligibility: "unverified"
  OCG_LUNA:
    model: "opencode-go-responses/gpt-5.6-luna"
    effort: "high"
    enabled: true
    verified: true
    eligibility: "eligible"
  STEP_3_7_FLASH:
    model: "nine-router/stepplan/step-3.7-flash"
    effort: "high"
    enabled: true
    verified: true
    eligibility: "eligible"
  QWEN_3_8_FLASH:
    model: "commandcode/qwen3.8-flash"
    effort: "high"
    enabled: true
    verified: true
    eligibility: "eligible"
  OPUS_COMBO:
    model: "nine-router/Opus"
    effort: "high"
    enabled: true
    verified: true
    eligibility: "eligible"
  PLUS_TERRA:
    model: "gpt-5.6-terra"
    effort: "high"
    enabled: true
    verified: true
    eligibility: "eligible"
  OX_ALPHA:
    model: "nine-router/OX-ALpha"
    effort: "default"
    enabled: false
    verified: false
    eligibility: "disabled"

operator_policy:
  BOSS:
    - endpoint: "SOL_HIGH"
      model: "gpt-5.6-sol"
      effort: "high"
    - endpoint: "GROK_4_6_HIGH"
      model: "nine-router/gcli/grok-4.6-high"
      effort: "high"
    - endpoint: "GROK_CURSOR_HIGH"
      model: "nine-router/cu/cursor-grok-4.6-high"
      effort: "high"
  SCOUT:
    - endpoint: "GEMINI_FLASH_MEDIUM"
      model: "nine-router/ag/gemini-3.7-flash-medium"
      effort: "medium"
    - endpoint: "QWEN_3_8_FLASH"
      model: "commandcode/qwen3.8-flash"
      effort: "high"
  STANDARD_WORKER:
    - endpoint: "GEMINI_FLASH_HIGH"
      model: "nine-router/ag/gemini-3.7-flash-high"
      effort: "high"
    - endpoint: "PLUS_LUNA"
      model: "gpt-5.6-luna"
      effort: "max"
  DEEP_WORKER:
    - endpoint: "GROK_4_6_HIGH"
      model: "nine-router/gcli/grok-4.6-high"
      effort: "high"
    - endpoint: "GEMINI_FLASH_HIGH"
      model: "nine-router/ag/gemini-3.7-flash-high"
      effort: "high"
    - endpoint: "SOL_HIGH"
      model: "gpt-5.6-sol"
      effort: "high"
  VERIFIER:
    - endpoint: "SOL_HIGH"
      model: "gpt-5.6-sol"
      effort: "high"
    - endpoint: "GROK_4_6_HIGH"
      model: "nine-router/gcli/grok-4.6-high"
      effort: "high"
    - endpoint: "OPUS_COMBO"
      model: "nine-router/Opus"
      effort: "high"
    - endpoint: "GEMINI_FLASH_HIGH"
      model: "nine-router/ag/gemini-3.7-flash-high"
      effort: "high"
  PREMIUM_SECOND_OPINION:
    - endpoint: "OPUS_COMBO"
      model: "nine-router/Opus"
      effort: "high"
    - endpoint: "PLUS_TERRA"
      model: "gpt-5.6-terra"
      effort: "high"

boss_chains:
  SolMode:
    - "SOL_HIGH"
    - "GROK_4_6_HIGH"
    - "GROK_CURSOR_HIGH"
  GrokMode:
    - "SOL_HIGH"
    - "GROK_4_6_HIGH"
    - "GROK_CURSOR_HIGH"

role_weights:
  SCOUT:
    SolMode:
      base:
        - endpoint: "GEMINI_FLASH_MEDIUM"
          weight: 100.0
        - endpoint: "QWEN_3_8_FLASH"
          weight: 0.0
    GrokMode:
      base:
        - endpoint: "GEMINI_FLASH_MEDIUM"
          weight: 100.0
        - endpoint: "QWEN_3_8_FLASH"
          weight: 0.0

  STANDARD_WORKER:
    SolMode:
      base:
        - endpoint: "GEMINI_FLASH_HIGH"
          weight: 100.0
        - endpoint: "PLUS_LUNA"
          weight: 0.0
      overlay:
        - endpoint: "OX_ALPHA"
          weight: 30.0
        - endpoint: "GEMINI_FLASH_HIGH"
          weight: 70.0
    GrokMode:
      base:
        - endpoint: "GEMINI_FLASH_HIGH"
          weight: 100.0
        - endpoint: "PLUS_LUNA"
          weight: 0.0
      overlay:
        - endpoint: "OX_ALPHA"
          weight: 30.0
        - endpoint: "GEMINI_FLASH_HIGH"
          weight: 70.0

  DEEP_WORKER:
    SolMode:
      base:
        - endpoint: "GROK_4_6_HIGH"
          weight: 100.0
        - endpoint: "GEMINI_FLASH_HIGH"
          weight: 0.0
        - endpoint: "SOL_HIGH"
          weight: 0.0
    GrokMode:
      base:
        - endpoint: "GROK_4_6_HIGH"
          weight: 100.0
        - endpoint: "GEMINI_FLASH_HIGH"
          weight: 0.0
        - endpoint: "SOL_HIGH"
          weight: 0.0

reviewer_tables:
  sol_family:
    SolMode: &verifier_chain
      - endpoint: "SOL_HIGH"
        weight: 100.0
      - endpoint: "GROK_4_6_HIGH"
        weight: 0.0
      - endpoint: "OPUS_COMBO"
        weight: 0.0
      - endpoint: "GEMINI_FLASH_HIGH"
        weight: 0.0
    GrokMode: *verifier_chain
  luna_family:
    SolMode: *verifier_chain
    GrokMode: *verifier_chain
  terra_family:
    SolMode: *verifier_chain
    GrokMode: *verifier_chain
  gemini:
    SolMode: *verifier_chain
    GrokMode: *verifier_chain
  supergrok:
    SolMode: *verifier_chain
    GrokMode: *verifier_chain
  opus:
    SolMode: *verifier_chain
    GrokMode: *verifier_chain
  cheap:
    SolMode: *verifier_chain
    GrokMode: *verifier_chain
  ox_combo:
    SolMode: *verifier_chain
    GrokMode: *verifier_chain
